<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kustos Analytics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --button-color: var(--tg-theme-button-color, #5288c1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 4px 0 0 0; font-size: 14px; color: var(--hint-color); }
        .card {
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 12px; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .violator-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .violator-item:last-child { border-bottom: none; }
        .violator-name { font-weight: 500; font-size: 14px; }
        .violator-count { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .nav-button {
            display: block; width: 100%; padding: 14px; text-align: center;
            background: var(--button-color); color: white; text-decoration: none;
            border-radius: 10px; font-weight: 600; margin-top: 10px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Kustos Analytics</h1>
        <p>Аналитика модерации</p>
    </div>

    <!-- График активности -->
    <div class="card">
        <div class="card-title">📈 Активность нарушений (7 дней)</div>
        <div class="chart-container">
            <canvas id="timelineChart"></canvas>
        </div>
    </div>

    <!-- Категории -->
    <div class="card">
        <div class="card-title">⚠️ Категории нарушений</div>
        <div class="chart-container">
            <canvas id="categoriesChart"></canvas>
        </div>
    </div>

    <!-- Топ нарушителей -->
    <div class="card">
        <div class="card-title">🏆 Топ нарушителей</div>
        <div id="violatorsList">Загрузка...</div>
    </div>

    <a href="index.html" class="nav-button">← Вернуться к управлению</a>

    <script>
        const API_BASE = 'https://telegram-bot-zakharsakharov.msk1.amvera.tech';
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Получаем chat_id из URL
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        const userId = tg.initDataUnsafe?.user?.id;

        if (!chatId) {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">Ошибка: Не передан ID группы</h2>';
        } else {
            loadData();
        }

        async function loadData() {
            try {
                // 1. График (Timeline)
                const respTimeline = await fetch(`${API_BASE}/api/timeline?chat_id=${chatId}&days=7`);
                const dataTimeline = await respTimeline.json();
                renderTimeline(dataTimeline.days || []);

                // 2. Категории
                const respCat = await fetch(`${API_BASE}/api/categories?chat_id=${chatId}`);
                const dataCat = await respCat.json();
                renderCategories(dataCat.categories || []);

                // 3. Топ нарушителей
                const respViol = await fetch(`${API_BASE}/api/top_violators?chat_id=${chatId}&limit=5`);
                const dataViol = await respViol.json();
                renderViolators(dataViol.violators || []);

            } catch (e) {
                console.error('Ошибка загрузки данных:', e);
                document.getElementById('violatorsList').innerHTML = '<p style="color:#e74c3c">Ошибка сети</p>';
            }
        }

        function renderTimeline(days) {
            const ctx = document.getElementById('timelineChart').getContext('2d');
            const labels = days.map(d => d.date.split('-').slice(1).join('.'));
            const data = days.map(d => d.violations || 0);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Нарушения',
                        data: data,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.2)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { ticks: { color: '#708499', font: {size: 10} } }, 
                        y: { beginAtZero: true, ticks: { color: '#708499', font: {size: 10} } } 
                    }
                }
            });
        }

        function renderCategories(cats) {
            const ctx = document.getElementById('categoriesChart').getContext('2d');
            if (cats.length === 0) return;
            
            const labels = cats.map(c => c.code);
            const data = cats.map(c => c.count);

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#e74c3c', '#f39c12', '#9b59b6', '#3498db', '#95a5a6', '#1abc9c'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: { legend: { position: 'right', labels: { color: '#708499', font: {size: 10}, boxWidth: 10 } } }
                }
            });
        }

        function renderViolators(list) {
            const container = document.getElementById('violatorsList');
            if (list.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:var(--hint-color)">Нарушений нет 🎉</p>';
                return;
            }
            let html = '';
            list.forEach((v, i) => {
                const name = v.first_name || v.username || `ID: ${v.user_id}`;
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                html += `
                    <div class="violator-item">
                        <span class="violator-name">${medal} ${name}</span>
                        <span class="violator-count">${v.count}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
